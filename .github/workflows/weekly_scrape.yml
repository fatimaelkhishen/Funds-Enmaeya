name: Daily Lebanon News Scrape

# Runs every day at 05:00 UTC (08:00 Beirut summer / 07:00 winter), or by hand
# from the Actions tab. Each run updates the main <Org>.xlsx files and creates
# scrapes/YYYY-MM-DD/ with ONLY that day's new articles + run_summary.csv.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Confirm Chrome is available (for JS-rendered sites)
        run: google-chrome --version

      - name: Pick today's folder name (Beirut date)
        run: echo "RUN_DATE=$(TZ=Asia/Beirut date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Run all scrapers
        run: python scraper/run_all.py --incremental --delay 1.5 --timeout 20 --daily-dir "scrapes/$RUN_DATE"

      - name: Commit and push new articles
        if: always()
        run: |
          git config user.name "news-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "*.xlsx" || true
          for p in scrapes scraper/state scraper/scrape_log.txt scraper/run_summary.csv; do
            [ -e "$p" ] && git add -- "$p"
          done
          git diff --cached --quiet || git commit -m "Daily news scrape: $RUN_DATE"
          git pull --rebase --autostash || true
          git push
