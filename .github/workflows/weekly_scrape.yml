name: Daily Lebanon News Scrape

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Confirm Chrome is available (for JS-rendered sites)
        run: google-chrome --version

      - name: Pick today's folder name (Beirut date)
        run: echo "RUN_DATE=$(TZ=Asia/Beirut date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Run all scrapers
        run: python scraper/run_all.py --incremental --delay 1.5 --timeout 20 --daily-dir "scrapes/$RUN_DATE"

      - name: Extract funding articles (AI)
        if: always()
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scraper/extract_funding.py --date "$RUN_DATE"

      - name: Commit and push new articles
        if: always()
        run: |
          git config user.name "news-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "*.xlsx" || true
          for p in scrapes scraper/state scraper/scrape_log.txt scraper/run_summary.csv; do
            [ -e "$p" ] && git add -- "$p"
          done
          git diff --cached --quiet || git commit -m "Daily news scrape: $RUN_DATE"
          git pull --rebase --autostash || true
          git push

      - name: Update dashboard
        if: always()
        continue-on-error: true
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          f="scrapes/$RUN_DATE/AI-Gen/Funding_$RUN_DATE.xlsx"
          if [ -z "$DASHBOARD_TOKEN" ] || [ ! -f "$f" ]; then echo "Nothing to send"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${DASHBOARD_TOKEN}@github.com/AyaAntar2004/enmaeyaFunds.git" "$RUNNER_TEMP/dashboard"
          mkdir -p "$RUNNER_TEMP/dashboard/daily" && cp "$f" "$RUNNER_TEMP/dashboard/daily/"
          cd "$RUNNER_TEMP/dashboard"
          pip install -q -r requirements.txt
          python sync_daily.py
          git config user.name "news-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily data.json downloads/funding-data.xlsx
          git diff --cached --quiet || git commit -m "Daily funding update: $RUN_DATE"
          git push
