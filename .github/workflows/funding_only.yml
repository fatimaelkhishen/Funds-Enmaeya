name: Funding extraction only

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to process (YYYY-MM-DD), must exist under scrapes/'
        required: true

permissions:
  contents: write

concurrency:
  group: news-scrape
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests openpyxl beautifulsoup4 trafilatura

      - name: Extract funding articles (AI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scraper/extract_funding.py --date "$RUN_DATE"

      - name: Commit result
        run: |
          git config user.name "news-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scrapes
          git diff --cached --quiet || git commit -m "Funding extraction: $RUN_DATE"
          git pull --rebase --autostash || true
          git push

      - name: Update dashboard
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          f="scrapes/$RUN_DATE/AI-Gen/Funding_$RUN_DATE.xlsx"
          if [ -z "$DASHBOARD_TOKEN" ] || [ ! -f "$f" ]; then echo "Nothing to send"; exit 0; fi
          TOKEN=$(printf '%s' "$DASHBOARD_TOKEN" | tr -d '[:space:]')
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/AyaAntar2004/enmaeyaFunds.git" "$RUNNER_TEMP/dashboard"
          git clone --depth 1 "https://x-access-token:${DASHBOARD_TOKEN}@github.com/AyaAntar2004/enmaeyaFunds.git" "$RUNNER_TEMP/dashboard"
          mkdir -p "$RUNNER_TEMP/dashboard/daily" && cp "$f" "$RUNNER_TEMP/dashboard/daily/"
          cd "$RUNNER_TEMP/dashboard"
          pip install -q -r requirements.txt
          python sync_daily.py
          git config user.name "news-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily data.json downloads/funding-data.xlsx
          git diff --cached --quiet || git commit -m "Daily funding update: $RUN_DATE"
          git push
